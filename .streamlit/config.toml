[client]
# Production look: hide Streamlit's Deploy button and developer menu from visitors.
toolbarMode = "minimal"

[theme]
# The apps' stylesheets assume a light page, so don't follow the OS dark mode.
base = "light"
primaryColor = "#1e3a8a"
# Streamlit's default success-text green is 4.3:1 on its own tint; this is 6:1.
greenTextColor = "#166534"
